# Shared development infrastructure.
#
#   npm run db:up      start MongoDB   (from the repo root)
#   npm run db:down    stop it         (data is kept in the volume)
#
# It also starts Mailpit, a LOCAL mail server for development only: it accepts any email on SMTP port 1025 and
# shows it at http://127.0.0.1:8025. Nothing leaves this machine, so it proves our sending works, NOT real delivery.
#
# One MongoDB instance serves every service in development, but each service has
# its own database and its own user (see mongo-init/). A service can only access
# its own database.
#
# Credentials come from infra/.env (see infra/.env.example).
name: framework-modular

services:
  mongo:
    image: mongo:8
    container_name: framework-modular-mongo
    restart: unless-stopped
    # Only reachable from this machine, not from the network.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in infra/.env}
      # One password per service database (used by mongo-init/).
      SUPER_ADMIN_AUTH_DB_PASSWORD: ${SUPER_ADMIN_AUTH_DB_PASSWORD:?Set SUPER_ADMIN_AUTH_DB_PASSWORD in infra/.env}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: framework-modular-mailpit
    restart: unless-stopped
    # Only reachable from this machine, not from the network.
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
volumes:
  mongo-data:
